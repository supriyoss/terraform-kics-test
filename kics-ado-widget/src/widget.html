<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>KICS Security Dashboard</title>

    <link rel="stylesheet" href="widget.css" />
</head>

<body>
    <div class="widget-container">

        <h2>Terraform IaC Security</h2>

        <div id="lastUpdated" class="subtitle">
            Waiting for weekly KICS data...
        </div>

        <div id="dashboard" class="hidden">

            <div class="cards">

                <div class="card">
                    <span>Pipelines</span>
                    <strong id="pipelines">0</strong>
                </div>

                <div class="card">
                    <span>Failed Gates</span>
                    <strong id="failedGates">0</strong>
                </div>

                <div class="card">
                    <span>Critical</span>
                    <strong id="critical">0</strong>
                </div>

                <div class="card">
                    <span>High</span>
                    <strong id="high">0</strong>
                </div>

            </div>

            <table>
                <thead>
                    <tr>
                        <th>Pipeline</th>
                        <th>Critical</th>
                        <th>High</th>
                        <th>Medium</th>
                        <th>Gate</th>
                    </tr>
                </thead>

                <tbody id="pipelineRows"></tbody>
            </table>

        </div>

        <div id="error"></div>

    </div>

    <script src="widget.js"></script>
</body>
</html>
