trigger: none

pr: none

pool: ADO-Pool

variables:
  KICS_IMAGE: checkmarx/kics:latest
  KICS_OUTPUT: $(Build.ArtifactStagingDirectory)/kics
  KICS_UPLOAD_JSON: 'true'
  # Define KICS_STORAGE_CONTAINER in pipeline variables or a variable group.
  # Define BLOB_CONNECTION_STRING as a secret pipeline variable.

jobs:
  - job: KicsSecurityScan
    displayName: KICS Security Scan
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail

          mkdir -p "$(KICS_OUTPUT)"

          docker run --rm \
            --volume "$(Build.SourcesDirectory):/path:ro" \
            --volume "$(KICS_OUTPUT):/output" \
            "$(KICS_IMAGE)" scan \
            --ci \
            --no-color \
            --path /path \
            --output-path /output \
            --output-name results \
            --report-formats json,html,sarif
        displayName: Run KICS scan
        continueOnError: true

      - bash: |
          set -euo pipefail

          KICS_JSON="$(KICS_OUTPUT)/results.json"
          SUMMARY="$(KICS_OUTPUT)/summary.json"

          if [[ ! -f "$KICS_JSON" ]]; then
            echo "KICS JSON result not found: $KICS_JSON"
            exit 1
          fi

          jq \
            --arg organization "$(System.CollectionUri)" \
            --arg project "$(System.TeamProject)" \
            --arg repository "$(Build.Repository.Name)" \
            --arg branch "$(Build.SourceBranchName)" \
            --arg commit "$(Build.SourceVersion)" \
            --arg pipeline "$(Build.DefinitionName)" \
            --arg buildId "$(Build.BuildId)" \
            --arg buildNumber "$(Build.BuildNumber)" \
            --arg buildUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)" \
            '{
              organization: $organization,
              project: $project,
              repository: $repository,
              branch: $branch,
              commit: $commit,
              pipeline: $pipeline,
              buildId: $buildId,
              buildNumber: $buildNumber,
              buildUrl: $buildUrl,
              kicsVersion: .kics_version,
              scanStart: .start,
              scanEnd: .end,
              filesScanned: .files_scanned,
              filesParsed: .files_parsed,
              critical: (.severity_counters.CRITICAL // 0),
              high: (.severity_counters.HIGH // 0),
              medium: (.severity_counters.MEDIUM // 0),
              low: (.severity_counters.LOW // 0),
              info: (.severity_counters.INFO // 0),
              totalFindings: (.total_counter // 0),
              securityGate: (if (.total_counter // 0) > 0 then "FAILED" else "PASSED" end)
            }' \
            "$KICS_JSON" > "$SUMMARY"

          echo 'Generated KICS summary:'
          cat "$SUMMARY"
        condition: always()
        displayName: Generate KICS Scan Summary

      - task: PublishBuildArtifacts@1
        condition: always()
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.html
          artifactName: kics-html
          publishLocation: Container
        displayName: Publish KICS HTML report

      - task: PublishBuildArtifacts@1
        condition: always()
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.sarif
          artifactName: CodeAnalysisLogs
          publishLocation: Container
        displayName: Publish KICS SARIF for Azure DevOps scan results

      - task: PublishBuildArtifacts@1
        condition: always()
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.json
          artifactName: kics-json
          publishLocation: Container
        displayName: Publish KICS JSON report

      - bash: |
          set -euo pipefail

          if [[ -z "${BLOB_CONNECTION_STRING:-}" ]]; then
            echo 'No Blob connection string was supplied.' >&2
            exit 1
          fi

          az storage blob upload \
            --connection-string "$BLOB_CONNECTION_STRING" \
            --container-name "$(KICS_STORAGE_CONTAINER)" \
            --name "kics/$(Build.DefinitionName)/$(Build.BuildNumber)/summary.json" \
            --file "$(KICS_OUTPUT)/summary.json" \
            --overwrite true
        env:
          BLOB_CONNECTION_STRING: $(BLOB_CONNECTION_STRING)
        condition: and(always(), eq(variables['KICS_UPLOAD_JSON'], 'true'))
        displayName: Upload KICS JSON report to Blob Storage

      - bash: |
          echo "Blob Storage is not configured; keeping the JSON report in the pipeline workspace."
        condition: and(always(), ne(variables['KICS_UPLOAD_JSON'], 'true'))
        displayName: Skip Blob Storage upload (test mode)
