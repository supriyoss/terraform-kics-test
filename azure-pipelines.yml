trigger: none

pr: none

pool: ADO-Pool

variables:
  KICS_IMAGE: checkmarx/kics:latest
  KICS_OUTPUT: $(Build.ArtifactStagingDirectory)/kics
  # Define AZURE_SERVICE_CONNECTION, KICS_STORAGE_ACCOUNT, and
  # KICS_STORAGE_CONTAINER in pipeline variables or a variable group.

jobs:
  - job: KicsSecurityScan
    displayName: KICS Security Scan
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail

          mkdir -p "$(KICS_OUTPUT)"

          set +e
          docker run --rm \
            --volume "$(Build.SourcesDirectory):/path:ro" \
            --volume "$(KICS_OUTPUT):/output" \
            "$(KICS_IMAGE)" scan \
            --ci \
            --no-color \
            --path /path \
            --output-path /output \
            --output-name results \
            --report-formats json,html,sarif
          kics_exit_code=$?
          set -e

          printf '%s\n' "$kics_exit_code" > "$(KICS_OUTPUT)/.kics-exit-code"
          echo "KICS scan exited with code $kics_exit_code."
        displayName: Run KICS scan

      - bash: |
          set -euo pipefail

          KICS_JSON="$(KICS_OUTPUT)/results.json"
          SUMMARY="$(KICS_OUTPUT)/summary.json"
          scan_exit_code="$(cat "$(KICS_OUTPUT)/.kics-exit-code")"
          organization="${SYSTEM_COLLECTIONURI:-}"
          project="${SYSTEM_TEAMPROJECT:-}"
          repository="${BUILD_REPOSITORY_NAME:-}"
          branch="${BUILD_SOURCEBRANCHNAME:-}"
          commit="${BUILD_SOURCEVERSION:-}"
          pipeline_name="${BUILD_DEFINITIONNAME:-pipeline}"
          pipeline_id="${BUILD_DEFINITIONID:-${SYSTEM_DEFINITIONID:-}}"
          build_id="${BUILD_BUILDID:-}"
          build_number="${BUILD_BUILDNUMBER:-}"
          build_url="${organization}${project}/_build/results?buildId=${build_id}"
          PIPELINE_NAME="$pipeline_name"
          SAFE_PIPELINE_NAME="$(echo "$PIPELINE_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          SAFE_PIPELINE_NAME="${SAFE_PIPELINE_NAME:-pipeline}"

          if [[ ! -f "$KICS_JSON" ]]; then
            echo "KICS JSON result not found: $KICS_JSON"
            exit 1
          fi

          case "$scan_exit_code" in
            0|20|30|40|50|60) ;;
            *)
              echo "KICS execution/configuration failed with exit code $scan_exit_code; summary will not be uploaded." >&2
              exit 1
              ;;
          esac

          jq \
            --arg organization "$organization" \
            --arg project "$project" \
            --arg repository "$repository" \
            --arg branch "$branch" \
            --arg commit "$commit" \
            --arg pipeline "$pipeline_name" \
            --arg pipelineId "$pipeline_id" \
            --arg buildId "$build_id" \
            --arg buildNumber "$build_number" \
            --arg buildUrl "$build_url" \
            --arg pipelineName "$SAFE_PIPELINE_NAME" \
            '{
              organization: $organization,
              project: $project,
              repository: $repository,
              branch: $branch,
              commit: $commit,
              pipeline: $pipeline,
              pipelineId: (if $pipelineId == "" then null else ($pipelineId | tonumber?) end),
              buildId: $buildId,
              buildNumber: $buildNumber,
              buildUrl: $buildUrl,
              pipelineName: $pipelineName,
              kicsVersion: .kics_version,
              scanTime: (.end // .start),
              scanStart: .start,
              scanEnd: .end,
              filesScanned: .files_scanned,
              filesParsed: .files_parsed,
              critical: (.severity_counters.CRITICAL // 0),
              high: (.severity_counters.HIGH // 0),
              medium: (.severity_counters.MEDIUM // 0),
              low: (.severity_counters.LOW // 0),
              info: (.severity_counters.INFO // 0),
              totalFindings: (.total_counter // 0),
              securityGate: (if ((.severity_counters.CRITICAL // 0) > 0 or (.severity_counters.HIGH // 0) > 0) then "FAILED" else "PASSED" end)
            }' \
            "$KICS_JSON" > "$SUMMARY"

          echo "##vso[task.setvariable variable=KICS_SUMMARY_READY]true"
          echo 'Generated KICS summary:'
          cat "$SUMMARY"
        condition: succeededOrFailed()
        displayName: Generate KICS Scan Summary

      - task: PublishBuildArtifacts@1
        condition: and(succeededOrFailed(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.html
          artifactName: kics-html
          publishLocation: Container
        displayName: Publish KICS HTML report

      - task: PublishBuildArtifacts@1
        condition: and(succeededOrFailed(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.sarif
          artifactName: CodeAnalysisLogs
          publishLocation: Container
        displayName: Publish KICS SARIF for Azure DevOps scan results

      - task: PublishBuildArtifacts@1
        condition: and(succeededOrFailed(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        inputs:
          pathToPublish: $(KICS_OUTPUT)/results.json
          artifactName: kics-json
          publishLocation: Container
        displayName: Publish KICS JSON report

      - bash: |
          set -euo pipefail

          missing=()
          [[ -n "${AZURE_SERVICE_CONNECTION:-}" ]] || missing+=(AZURE_SERVICE_CONNECTION)
          [[ -n "${KICS_STORAGE_ACCOUNT:-}" ]] || missing+=(KICS_STORAGE_ACCOUNT)
          [[ -n "${KICS_STORAGE_CONTAINER:-}" ]] || missing+=(KICS_STORAGE_CONTAINER)

          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing required pipeline variables: ${missing[*]}" >&2
            echo 'Configure them in Azure DevOps pipeline variables or a linked variable group.' >&2
            echo 'AZURE_SERVICE_CONNECTION must be the exact Azure DevOps service connection name.' >&2
            exit 1
          fi
        condition: and(succeededOrFailed(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        displayName: Validate Azure Blob reporting configuration

      - task: AzureCLI@2
        condition: and(succeeded(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        inputs:
          azureSubscription: $(AZURE_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            PIPELINE_NAME="${BUILD_DEFINITIONNAME:-pipeline}"
            SAFE_PIPELINE_NAME="$(echo "$PIPELINE_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
            SAFE_PIPELINE_NAME="${SAFE_PIPELINE_NAME:-pipeline}"

            az storage blob upload \
              --auth-mode login \
              --account-name "$(KICS_STORAGE_ACCOUNT)" \
              --container-name "$(KICS_STORAGE_CONTAINER)" \
              --name "current/$SAFE_PIPELINE_NAME/summary.json" \
              --file "$(KICS_OUTPUT)/summary.json" \
              --overwrite true
        displayName: Upload current KICS summary to Blob Storage

      - bash: |
          set -euo pipefail

          scan_exit_code="$(cat "$(KICS_OUTPUT)/.kics-exit-code")"
          total_findings="$(jq -r '.totalFindings // 0' "$(KICS_OUTPUT)/summary.json")"
          critical="$(jq -r '.critical // 0' "$(KICS_OUTPUT)/summary.json")"
          high="$(jq -r '.high // 0' "$(KICS_OUTPUT)/summary.json")"

          if [[ "$scan_exit_code" -eq 70 || "$scan_exit_code" -eq 126 || "$scan_exit_code" -eq 130 ]]; then
            echo "KICS execution failed with exit code $scan_exit_code; reporting is not a security finding result." >&2
            exit 1
          fi

          if [[ "$critical" -gt 0 || "$high" -gt 0 ]]; then
            echo "KICS security gate would fail: critical=$critical, high=$high, total=$total_findings."
          else
            echo "KICS security gate passed: critical=$critical, high=$high, total=$total_findings."
          fi

          echo 'KICS enforcement is disabled for this test pipeline; findings do not fail the build.'
        condition: and(succeededOrFailed(), eq(variables['KICS_SUMMARY_READY'], 'true'))
        displayName: Report KICS security gate (non-blocking)